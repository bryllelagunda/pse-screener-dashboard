name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/static.mjs
      - run: node tests/screens.mjs
      - run: node tests/status.mjs
      - run: node tests/history.mjs
      - run: node tests/guards.mjs
      - run: node tests/key.mjs
      - run: node tests/summary.mjs
      - run: node tests/demo.mjs check
